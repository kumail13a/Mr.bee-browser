name: Build Browser APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name shown under the icon
        default: متصفح المانغا

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack project
        run: unzip -q bubble-browser.zip -d proj

      - name: Set app name
        env:
          APP_NAME: ${{ inputs.app_name || 'متصفح المانغا' }}
        run: sed -i "s|__APP_NAME__|${APP_NAME}|" proj/app/src/main/res/values/strings.xml

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Keep APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "browser-${{ github.run_number }}" \
            proj/app/build/outputs/apk/debug/app-debug.apk \
            --title "Browser APK ${{ github.run_number }}" \
            --notes "Debug APK"
